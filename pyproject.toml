[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-ml"
version = "2.0.0"
description = "Scientifically conservative TESS transit detection and triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
  "astropy>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "torch>=2.2", "shap>=0.44", "optuna>=3.6"]
io = ["lightkurve>=2.4", "h5py>=3.10"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
